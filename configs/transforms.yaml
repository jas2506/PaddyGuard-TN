# Image transforms (M3). Operations follow ARCHITECTURE.md M3; the numeric magnitudes marked
# "design choice" are not given in the spec and are starting values, not tuned.
img_size: 224
resize: 256                          # eval: shortest side -> 256, then centre crop img_size
mean: [0.485, 0.456, 0.406]          # ImageNet
std: [0.229, 0.224, 0.225]
baseline:
  crop_scale: [0.5, 1.0]             # RandomResizedCrop (spec)
  hflip_p: 0.5
strong:                              # baseline plus the operations below
  rotation: {limit: 15, p: 0.5}                                          # design choice
  color_jitter: {brightness: 0.3, contrast: 0.3, saturation: 0.3, hue: 0.05, p: 0.8}   # design choice
  brightness_contrast: {limit: 0.2, p: 0.5}                              # design choice
  hue_sat_value: {hue: 15, sat: 25, val: 15, p: 0.5}                     # design choice
  gaussian_blur: {blur_limit: [3, 7], p: 0.3}                            # design choice
  jpeg: {quality: [40, 95], p: 0.5}                                      # quality range from the spec
  coarse_dropout: {holes: [1, 4], size_fraction: [0.05, 0.2], p: 0.3}    # design choice
