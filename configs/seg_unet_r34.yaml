encoder_name: resnet34
encoder_weights: imagenet
classes: 2                 # sigmoid outputs: leaf, lesion
img_size: 384
epochs: 20
batch_size: 8
optimizer: {name: adamw, lr: 3.0e-4}
scheduler: {name: cosine}
loss: bce_dice             # per channel
amp: true
threshold: 0.5
variant: V0                # V0 standard aug | V1 plus background-paste aug
paste_prob: 0.5            # used by V1 only
seed: 0
